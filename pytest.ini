[pytest]
testpaths = tests
# Por padrão não roda os testes que leem o HD de dados (lentos). Para rodá-los: pytest -m dataset
addopts = -m "not dataset" -p no:cacheprovider
markers =
    models: usa os modelos reais de ./models (pulado se não existirem)
    dataset: mede o acerto nos conjuntos de teste completos do HD de dados (lento)
log_level = WARNING
